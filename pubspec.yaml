name: my_song_book
description: "Il mio canzoniere Flutter con gestione accordi e loghi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Salvataggio dati
  shared_preferences: ^2.2.2
  
  # Font e stile
  google_fonts: ^6.1.0
  
  # Gestione ID univoci
  uuid: ^4.2.1
  
  # Download e parsing web
  http: ^1.1.0
  html: ^0.15.4

  # --- NUOVE DIPENDENZE PER PDF E CONDIVISIONE ---
  pdf: ^3.10.8
  printing: ^5.11.0
  share_plus: ^10.0.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # AGGIUNTO PER GENERARE LE ICONE
  flutter_launcher_icons: ^0.13.1

# CONFIGURAZIONE ICONA APP
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # --- SEZIONE ASSETS ---
  assets:
    - assets/images/logo_horizontal.png
    - assets/images/logo_vertical.png
    - assets/images/app_icon.png